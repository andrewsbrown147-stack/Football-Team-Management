<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Team Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>⚽ Football Team Management System</h1>
        <p>Manage your football team easily</p>
    </header>

    <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#players">Players</a>
        <a href="#add-player">Add Player</a>
    </nav>

    <main>
        <section id="dashboard" class="dashboard">
            <h2>Team Dashboard</h2>

            <div class="stats">
                <div class="card">
                    <h3>Total Players</h3>
                    <p id="totalPlayers">0</p>
                </div>

                <div class="card">
                    <h3>Total Goals</h3>
                    <p id="totalGoals">0</p>
                </div>
            </div>
        </section>

        <section id="add-player" class="form-section">
            <h2>Add a Player</h2>

            <form id="playerForm">
                <label for="playerName">Player Name:</label>
                <input type="text" id="playerName"
                       placeholder="Enter player's name" required>

                <label for="jerseyNumber">Jersey Number:</label>
                <input type="number" id="jerseyNumber"
                       min="1" max="99" required>

                <label for="position">Position:</label>
                <select id="position" required>
                    <option value="">Select Position</option>
                    <option value="Goalkeeper">Goalkeeper</option>
                    <option value="Defender">Defender</option>
                    <option value="Midfielder">Midfielder</option>
                    <option value="Forward">Forward</option>
                </select>

                <label for="goals">Goals Scored:</label>
                <input type="number" id="goals" min="0" value="0" required>

                <button type="submit">Add Player</button>
            </form>
        </section>

        <section id="players" class="players-section">
            <h2>Team Players</h2>

            <input type="search" id="searchInput"
                   placeholder="Search for a player...">

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Jersey Number</th>
                            <th>Position</th>
                            <th>Goals</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="playerTable">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Football Team Management System | Student Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
